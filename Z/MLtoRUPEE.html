<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ML ⇄ Rupee Converter</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .converter {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .box {
      background: #ffffff;
      border: 2px solid #e5e5e5;
      border-radius: 16px;
      padding: 30px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: 0.2s ease;
    }

    .box:focus-within {
      border-color: #000;
    }

    .box label {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .box input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 42px;
      font-weight: bold;
      background: transparent;
    }

    .rate {
      position: fixed;
      bottom: 25px;
      font-size: 14px;
      color: #777;
    }

    @media (max-width: 600px) {
      .converter {
        grid-template-columns: 1fr;
      }

      .box {
        min-height: 180px;
      }
    }
  </style>
</head>

<body>

  <div class="converter">

    <!-- ML Box -->
    <div class="box">
      <label for="ml">ML</label>
      <input
        type="number"
        id="ml"
        placeholder="Enter ML"
        min="0"
        step="any"
      />
    </div>

    <!-- Rupee Box -->
    <div class="box">
      <label for="rupee">₹ Rupee</label>
      <input
        type="number"
        id="rupee"
        placeholder="Enter Rupee"
        min="0"
        step="any"
      />
    </div>

  </div>

  <div class="rate">
    Rate: 100 ML = ₹40
  </div>


  <script>
    const mlInput = document.getElementById("ml");
    const rupeeInput = document.getElementById("rupee");

    // 100 ML = ₹40
    // 1 ML = ₹0.40

    mlInput.addEventListener("input", function () {
      const ml = parseFloat(this.value);

      if (isNaN(ml)) {
        rupeeInput.value = "";
        return;
      }

      const rupees = ml * 0.40;

      rupeeInput.value = rupees.toFixed(2);
    });


    rupeeInput.addEventListener("input", function () {
      const rupees = parseFloat(this.value);

      if (isNaN(rupees)) {
        mlInput.value = "";
        return;
      }

      const ml = rupees / 0.40;

      mlInput.value = ml.toFixed(2);
    });
  </script>

</body>
</html>
