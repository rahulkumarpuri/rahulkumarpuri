
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>बचत पासबुक — Savings Passbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --vault: #0e1a13;
    --vault-deep: #0a130d;
    --paper: #f1e8d0;
    --paper-dim: #e7dcbf;
    --ink: #23301f;
    --ink-soft: #5c6152;
    --brass: #c9a227;
    --brass-bright: #e6c257;
    --stamp-red: #9c3b34;
    --stamp-green: #3f6b4a;
    --line: rgba(35,48,31,0.18);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #16281c 0%, var(--vault) 55%, var(--vault-deep) 100%);
    font-family:'Space Grotesk', sans-serif;
    color:var(--paper);
    display:flex;
    justify-content:center;
    padding:48px 20px 80px;
  }

  .brass-texture{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: radial-gradient(circle at 20% 20%, rgba(201,162,39,0.05), transparent 40%),
                       radial-gradient(circle at 80% 70%, rgba(201,162,39,0.04), transparent 45%);
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:560px;
  }

  header{
    text-align:center;
    margin-bottom:28px;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:10px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:34px;
    margin:0;
    color:var(--paper);
    letter-spacing:0.01em;
  }

  h1 span{
    display:block;
    font-size:15px;
    font-weight:400;
    font-style:italic;
    color:var(--paper-dim);
    margin-top:6px;
    opacity:0.7;
  }

  .passbook{
    background:var(--paper);
    color:var(--ink);
    border-radius:6px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 0 0 1px rgba(201,162,39,0.25),
      inset 0 0 0 8px var(--vault-deep);
    padding:34px 30px 8px;
    position:relative;
    overflow:hidden;
  }

  .passbook::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:34px;
    background:repeating-linear-gradient(
      to bottom,
      rgba(35,48,31,0.06) 0,
      rgba(35,48,31,0.06) 1px,
      transparent 1px,
      transparent 18px
    );
    border-right:1px dashed rgba(35,48,31,0.2);
  }

  .passbook-inner{
    padding-left:20px;
  }

  /* Progress dial */
  .dial-row{
    display:flex;
    align-items:center;
    gap:26px;
    padding-bottom:26px;
    border-bottom:1px dashed var(--line);
  }

  .dial{
    position:relative;
    width:132px;
    height:132px;
    flex-shrink:0;
  }

  .dial svg{ transform:rotate(-90deg); }

  .dial-track{ fill:none; stroke:rgba(35,48,31,0.1); stroke-width:10; }
  .dial-fill{
    fill:none;
    stroke:url(#brassGrad);
    stroke-width:10;
    stroke-linecap:round;
    transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1);
  }

  .dial-label{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .dial-pct{
    font-family:'Fraunces', serif;
    font-size:28px;
    font-weight:600;
    line-height:1;
  }
  .dial-pct-sign{ font-size:15px; opacity:0.6; }

  .dial-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:4px;
  }

  .figures{ flex:1; }

  .figures .row{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:5px 0;
    color:var(--ink-soft);
  }

  .figures .row b{
    color:var(--ink);
    font-weight:600;
    font-size:15px;
  }

  .celebrate{
    margin-top:8px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:13px;
    color:var(--stamp-green);
    display:none;
  }
  .celebrate.show{ display:block; }

  /* Entry form */
  .entry-form{
    padding:24px 0;
    border-bottom:1px dashed var(--line);
  }

  .entry-form label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:block;
    margin-bottom:8px;
  }

  .entry-fields{
    display:flex;
    gap:10px;
    align-items:stretch;
  }

  .amount-box{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    background:#fff;
    border:1.5px solid rgba(35,48,31,0.2);
    border-radius:8px;
    padding:0 12px;
    transition:border-color .2s;
  }
  .amount-box:focus-within{ border-color:var(--brass); }

  .amount-box .rupee{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    color:var(--ink-soft);
    margin-right:2px;
  }

  .amount-box input{
    border:none;
    outline:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:17px;
    font-weight:500;
    color:var(--ink);
    background:transparent;
    padding:12px 4px;
    width:100%;
  }

  .date-box{
    position:relative;
    display:flex;
    align-items:center;
    background:#fff;
    border:1.5px solid rgba(35,48,31,0.2);
    border-radius:8px;
    padding:0 10px;
    transition:border-color .2s;
  }
  .date-box:focus-within{ border-color:var(--brass); }

  .date-box input{
    border:none;
    outline:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink);
    background:transparent;
    padding:12px 2px;
    width:128px;
  }

  .add-btn{
    border:none;
    border-radius:8px;
    padding:0 22px;
    background:linear-gradient(135deg, var(--brass-bright), var(--brass));
    color:#2a2005;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:transform .15s, box-shadow .15s;
    box-shadow:0 6px 16px -6px rgba(201,162,39,0.6);
  }
  .add-btn:hover{ transform:translateY(-1px); box-shadow:0 8px 20px -6px rgba(201,162,39,0.75); }
  .add-btn:active{ transform:translateY(0px) scale(0.98); }

  .form-error{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--stamp-red);
    margin-top:8px;
    min-height:14px;
  }

  /* History */
  .history{
    padding:22px 0 26px;
  }

  .history-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:14px;
  }

  .history-head h2{
    font-family:'Fraunces', serif;
    font-size:16px;
    font-weight:600;
    margin:0;
    letter-spacing:0.02em;
  }

  .history-head .count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  .ledger{
    max-height:320px;
    overflow-y:auto;
    padding-right:6px;
  }
  .ledger::-webkit-scrollbar{ width:5px; }
  .ledger::-webkit-scrollbar-thumb{ background:rgba(35,48,31,0.2); border-radius:4px; }

  .entry-row{
    display:grid;
    grid-template-columns:auto 1fr auto auto;
    align-items:center;
    gap:12px;
    padding:11px 4px;
    border-bottom:1px solid var(--line);
    animation:slideIn .4s ease;
  }
  .entry-row:last-child{ border-bottom:none; }

  @keyframes slideIn{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .stamp{
    width:30px; height:30px;
    border:1.5px solid var(--stamp-green);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--stamp-green);
    font-size:13px;
    transform:rotate(-8deg);
    flex-shrink:0;
    font-weight:700;
    opacity:0.85;
  }

  .entry-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
  }

  .entry-amt{
    font-family:'IBM Plex Mono', monospace;
    font-size:14.5px;
    font-weight:600;
    color:var(--stamp-green);
    text-align:right;
  }

  .del-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    opacity:0.35;
    cursor:pointer;
    font-size:15px;
    padding:2px 4px;
    transition:opacity .15s, color .15s;
  }
  .del-btn:hover{ opacity:1; color:var(--stamp-red); }

  .empty-state{
    text-align:center;
    padding:30px 10px;
    color:var(--ink-soft);
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:14px;
  }

  .footer-strip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 4px 6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
  }

  .reset-link{
    background:none;
    border:none;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
  }
  .reset-link:hover{ color:var(--stamp-red); }

  .loading-note{
    text-align:center;
    color:var(--paper-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    padding:30px 0;
  }

</style>
</head>
<body>
<div class="brass-texture"></div>
<div class="wrap">

  <header>
    <div class="eyebrow">Personal Ledger · Est. Today</div>
    <h1>बचत पासबुक
      <span>हर एंट्री, एक कदम लक्ष्य की ओर — ₹35,000</span>
    </h1>
  </header>

  <div class="passbook" id="passbook">
    <div class="loading-note" id="loadingNote">पासबुक खोली जा रही है…</div>
  </div>

</div>

<script>
const TARGET = 35000;
const STORAGE_KEY = 'passbook-entries';

let entries = [];
let loaded = false;

function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}

function fmtINR(n){
  return '₹' + Math.round(n).toLocaleString('en-IN');
}

function fmtDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('hi-IN', {day:'2-digit', month:'short', year:'2-digit'});
}

async function loadEntries(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    entries = res ? JSON.parse(res.value) : [];
  } catch(e){
    entries = [];
  }
  loaded = true;
  render();
}

async function saveEntries(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
  } catch(e){
    console.error('save failed', e);
  }
}

function totalSaved(){
  return entries.reduce((s,e)=>s+e.amount,0);
}

function buildUI(){
  const el = document.getElementById('passbook');
  el.innerHTML = `
    <div class="passbook-inner">
      <div class="dial-row">
        <div class="dial">
          <svg viewBox="0 0 132 132" width="132" height="132">
            <defs>
              <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#e6c257"/>
                <stop offset="100%" stop-color="#9c7715"/>
              </linearGradient>
            </defs>
            <circle class="dial-track" cx="66" cy="66" r="56"/>
            <circle class="dial-fill" id="dialFill" cx="66" cy="66" r="56"
              stroke-dasharray="351.86" stroke-dashoffset="351.86"/>
          </svg>
          <div class="dial-label">
            <div class="dial-pct"><span id="pctNum">0</span><span class="dial-pct-sign">%</span></div>
            <div class="dial-tag">पूर्ण</div>
          </div>
        </div>
        <div class="figures">
          <div class="row"><span>जमा राशि</span><b id="savedAmt">₹0</b></div>
          <div class="row"><span>लक्ष्य</span><b>${fmtINR(TARGET)}</b></div>
          <div class="row"><span>शेष राशि</span><b id="remainAmt">${fmtINR(TARGET)}</b></div>
          <div class="celebrate" id="celebrateMsg">🎉 बधाई हो! लक्ष्य पूरा हुआ!</div>
        </div>
      </div>

      <div class="entry-form">
        <label>Enter Savings Amount — आज कितना जमा किया?</label>
        <div class="entry-fields">
          <div class="amount-box">
            <span class="rupee">₹</span>
            <input type="number" id="amountInput" placeholder="जैसे: 500" min="1" step="1">
          </div>
          <div class="date-box">
            <input type="date" id="dateInput">
          </div>
          <button class="add-btn" id="addBtn">जमा करें →</button>
        </div>
        <div class="form-error" id="formError"></div>
      </div>

      <div class="history">
        <div class="history-head">
          <h2>इतिहास · History</h2>
          <span class="count" id="entryCount">0 entries</span>
        </div>
        <div class="ledger" id="ledger"></div>
      </div>

      <div class="footer-strip">
        <span>हर एंट्री सुरक्षित है</span>
        <button class="reset-link" id="resetBtn">सब हटाएं (reset)</button>
      </div>
    </div>
  `;

  document.getElementById('dateInput').value = todayStr();
  document.getElementById('dateInput').max = todayStr();

  document.getElementById('addBtn').addEventListener('click', handleAdd);
  document.getElementById('amountInput').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') handleAdd();
  });
  document.getElementById('resetBtn').addEventListener('click', handleReset);
}

async function handleAdd(){
  const amtInput = document.getElementById('amountInput');
  const dateInput = document.getElementById('dateInput');
  const errBox = document.getElementById('formError');

  const amount = parseFloat(amtInput.value);
  const date = dateInput.value || todayStr();

  if(!amount || amount <= 0){
    errBox.textContent = 'कृपया सही राशि दर्ज करें (0 से अधिक)';
    return;
  }
  errBox.textContent = '';

  const entry = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    date,
    amount,
    createdAt: Date.now()
  };
  entries.push(entry);
  await saveEntries();

  amtInput.value = '';
  amtInput.focus();
  renderDial();
  renderLedger();
}

async function handleDelete(id){
  entries = entries.filter(e => e.id !== id);
  await saveEntries();
  renderDial();
  renderLedger();
}

async function handleReset(){
  if(!confirm('क्या आप वाकई पूरी पासबुक रीसेट करना चाहते हैं? यह वापस नहीं हो सकता।')) return;
  entries = [];
  await saveEntries();
  renderDial();
  renderLedger();
}

function renderDial(){
  const total = totalSaved();
  const pct = Math.min(100, Math.round((total/TARGET)*100));
  const circumference = 351.86;
  const offset = circumference - (Math.min(pct,100)/100)*circumference;

  document.getElementById('dialFill').style.strokeDashoffset = offset;
  document.getElementById('pctNum').textContent = pct;
  document.getElementById('savedAmt').textContent = fmtINR(total);
  document.getElementById('remainAmt').textContent = fmtINR(Math.max(0, TARGET-total));

  const celebrate = document.getElementById('celebrateMsg');
  if(total >= TARGET){
    celebrate.classList.add('show');
  } else {
    celebrate.classList.remove('show');
  }
}

function renderLedger(){
  const ledgerEl = document.getElementById('ledger');
  document.getElementById('entryCount').textContent = entries.length + ' entries';

  if(entries.length === 0){
    ledgerEl.innerHTML = `<div class="empty-state">अभी तक कोई एंट्री नहीं — पहली बचत जोड़ें ऊपर से</div>`;
    return;
  }

  const sorted = [...entries].sort((a,b)=>{
    if(a.date !== b.date) return b.date.localeCompare(a.date);
    return b.createdAt - a.createdAt;
  });

  ledgerEl.innerHTML = sorted.map(e => `
    <div class="entry-row">
      <div class="stamp">जमा</div>
      <div class="entry-date">${fmtDate(e.date)}</div>
      <div class="entry-amt">+${fmtINR(e.amount)}</div>
      <button class="del-btn" data-id="${e.id}" title="हटाएं">✕</button>
    </div>
  `).join('');

  ledgerEl.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> handleDelete(btn.getAttribute('data-id')));
  });
}

function render(){
  buildUI();
  renderDial();
  renderLedger();
}

loadEntries();
</script>
</body>
</html>
