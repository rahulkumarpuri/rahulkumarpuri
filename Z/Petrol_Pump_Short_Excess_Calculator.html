<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petrol Pump Short / Excess</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:20px}
.container{max-width:500px;margin:auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
h2{text-align:center;margin-top:0}
h3{margin-bottom:6px}
label{display:block;margin-top:10px;font-weight:bold;font-size:.9em}
input[type=number],input[type=text]{width:100%;padding:10px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;margin-top:4px}
.result{margin-top:15px;padding:10px;background:#f7f7f7;border-radius:6px;font-weight:bold}
.result.sub{font-weight:normal;font-size:.85em;color:#555;margin-top:6px;background:none;padding:0}
.short{color:#c00}
.excess{color:#090}
.btn{width:100%;padding:10px;margin-top:12px;border:none;border-radius:6px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
.btn.secondary{background:#555}
.btn.small{width:auto;padding:6px 12px;margin-top:0;font-size:.85em}
.section{margin-top:14px;border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px}
.toggle-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:bold}
.arrow{transition:transform .15s;font-size:.9em}
.arrow.open{transform:rotate(90deg)}
.locked-note{font-size:.8em;color:#777;font-weight:normal}
.tag-input-wrap{position:relative}
.suggestions{position:absolute;left:0;right:0;background:#fff;border:1px solid #ccc;border-top:none;border-radius:0 0 6px 6px;max-height:150px;overflow-y:auto;z-index:10}
.suggestions div{padding:8px 10px;cursor:pointer;font-size:.9em}
.suggestions div:hover{background:#eef2ff}
.tag-row{border:1px solid #e5e5e5;border-radius:6px;margin-top:8px;overflow:hidden}
.tag-header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;cursor:pointer;background:#fafafa}
.tag-body{padding:0 12px}
.entry-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #eee;font-size:.9em}
.entry-row:first-child{border-top:none}
.entry-left{color:#333}
.entry-time{color:#999;font-size:.8em;display:block}
.entry-icons span{cursor:pointer;margin-left:8px;font-size:1em}
.edit-row{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid #eee;flex-wrap:wrap}
.edit-row input{width:auto;flex:1;padding:6px;margin-top:0;min-width:80px}
.hidden{display:none !important}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nozzle-box{background:#fafafa;border-radius:6px;padding:8px}
.nozzle-box label{margin-top:0}
.row-flex{display:flex;justify-content:space-between;align-items:center}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;transition:.2s;border-radius:24px}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background-color:#fff;transition:.2s;border-radius:50%}
input:checked + .slider{background-color:#2563eb}
input:checked + .slider:before{transform:translateX(20px)}
</style>
</head>
<body>
<div class="container">
<h2>Petrol Pump Short / Excess</h2>

<div id="openingSection"></div>
<div id="closingSection"></div>

<div class="result">Today's Sale: ₹ <span id="sale">0.00</span></div>
<div class="result sub" id="saleBreakdown"></div>

<div class="section">
  <label style="margin-top:0">Total Oil Sale (ml)</label>
  <input type="number" step="1" id="oilMl" placeholder="0">
</div>

<div class="section row-flex">
  <span style="font-weight:bold">TESTING</span>
  <label class="switch">
    <input type="checkbox" id="testingToggle">
    <span class="slider"></span>
  </label>
</div>

<h3 style="margin-top:20px">Collections</h3>
<button class="btn" id="addEntryBtn" onclick="toggleAddForm()">+ Add Entry</button>
<div id="addForm" class="hidden">
  <label>Amount</label>
  <input type="number" step="0.01" id="entryAmount" placeholder="0.00">
  <label>Tags</label>
  <div class="tag-input-wrap">
    <input type="text" id="entryTag" autocomplete="off" placeholder="Type a tag...">
    <div id="tagSuggestions" class="suggestions hidden"></div>
  </div>
  <button class="btn" onclick="addEntry()">Add</button>
</div>

<div id="tagsList"></div>

<div class="result">Collected: ₹ <span id="collected">0.00</span></div>
<div class="result sub" id="testingNote"></div>
<div class="result" id="status">Difference: ₹0.00</div>

<button class="btn secondary" onclick="clearData()">Clear Today's Data</button>
</div>

<script>
/* ---------- constants ---------- */
const RATES = [114.28, 103.19, 114.28, 103.19]; // nozzle 1,2,3,4 (index 0-3)
const FUEL  = ["Petrol","Diesel","Petrol","Diesel"];
const DEFAULT_TAGS = ["Card","Credit Vehicles","Test","Deposited Cash","Phonepe","Cash","Coin"];
const OIL_RATE_PER_LITER = 400;
const TESTING_AMOUNT = 2174.7;
const todayStr = new Date().toISOString().slice(0,10);

/* ---------- storage helpers ---------- */
function getJSON(key, def){
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : def;
  }catch(e){ return def; }
}
function setJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

function ensureDay(){
  const storedDay = localStorage.getItem("pumpDay");
  if(storedDay !== todayStr){
    localStorage.removeItem("pumpOpening");
    localStorage.removeItem("pumpClosing");
    localStorage.removeItem("pumpCollections");
    localStorage.removeItem("pumpOilMl");
    localStorage.setItem("pumpDay", todayStr);
  }
  if(!localStorage.getItem("pumpTags")){
    setJSON("pumpTags", DEFAULT_TAGS);
  }
}
ensureDay();

function getOpening(){ return getJSON("pumpOpening", {saved:false, values:[null,null,null,null]}); }
function setOpening(d){ setJSON("pumpOpening", d); }
function getClosing(){ return getJSON("pumpClosing", {saved:false, values:[null,null,null,null]}); }
function setClosing(d){ setJSON("pumpClosing", d); }
function getCollections(){ return getJSON("pumpCollections", []); }
function setCollections(a){ setJSON("pumpCollections", a); }
function getTags(){ return getJSON("pumpTags", DEFAULT_TAGS.slice()); }
function setTags(a){ setJSON("pumpTags", a); }
function getOilMl(){ return getJSON("pumpOilMl", 0); }
function setOilMl(v){ setJSON("pumpOilMl", v); }
function getTesting(){ return getJSON("pumpTestingOn", false); }
function setTesting(v){ setJSON("pumpTestingOn", v); }

/* ---------- transient UI state (resets each page load) ---------- */
let openingExpanded = false;
let closingExpanded = false;
let tagExpanded = {};
let editingId = null;
let editBuffer = {amount:"", tag:""};

/* ---------- formatting ---------- */
function fmt(x){ return (x||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }

/* ---------- rendering: opening / closing nozzle sections ---------- */
function renderNozzleSection(kind){
  const containerId = kind === "opening" ? "openingSection" : "closingSection";
  const label = kind === "opening" ? "Opening CumVolume" : "Closing CumVolume";
  const data = kind === "opening" ? getOpening() : getClosing();
  const expanded = kind === "opening" ? openingExpanded : closingExpanded;
  const container = document.getElementById(containerId);

  if(!data.saved){
    let boxes = "";
    for(let i=0;i<4;i++){
      const v = data.values[i] !== null && data.values[i] !== undefined ? data.values[i] : "";
      boxes += `<div class="nozzle-box">
        <label>Nozzle ${i+1} (${FUEL[i]})</label>
        <input type="number" step="0.001" id="${kind}_${i}" value="${v}">
      </div>`;
    }
    container.innerHTML = `
      <div class="section">
        <h3 style="margin-top:0">${label}</h3>
        <div class="grid4">${boxes}</div>
        <button class="btn" onclick="save${cap(kind)}()">Save ${label}</button>
      </div>`;
  } else {
    let boxes = "";
    for(let i=0;i<4;i++){
      boxes += `<div class="nozzle-box">
        <label>Nozzle ${i+1} (${FUEL[i]})</label>
        <input type="number" step="0.001" id="${kind}_${i}" value="${data.values[i]}">
      </div>`;
    }
    container.innerHTML = `
      <div class="section">
        <div class="toggle-header" onclick="toggleNozzle('${kind}')">
          <span>${label} <span class="locked-note">(saved)</span></span>
          <span class="arrow ${expanded ? 'open' : ''}">▸</span>
        </div>
        <div class="${expanded ? '' : 'hidden'}" style="margin-top:10px">
          <div class="grid4">${boxes}</div>
          <button class="btn" onclick="update${cap(kind)}()">Update ${label}</button>
        </div>
      </div>`;
  }
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function readNozzleInputs(kind){
  const vals = [];
  for(let i=0;i<4;i++){
    const el = document.getElementById(`${kind}_${i}`);
    vals.push(el ? num(el.value) : 0);
  }
  return vals;
}

function saveOpening(){
  const vals = readNozzleInputs("opening");
  setOpening({saved:true, values:vals});
  openingExpanded = false;
  renderAll();
}
function updateOpening(){
  const vals = readNozzleInputs("opening");
  setOpening({saved:true, values:vals});
  openingExpanded = false;
  renderAll();
}
function saveClosing(){
  const vals = readNozzleInputs("closing");
  setClosing({saved:true, values:vals});
  closingExpanded = false;
  renderAll();
}
function updateClosing(){
  const vals = readNozzleInputs("closing");
  setClosing({saved:true, values:vals});
  closingExpanded = false;
  renderAll();
}
function toggleNozzle(kind){
  if(kind === "opening") openingExpanded = !openingExpanded;
  else closingExpanded = !closingExpanded;
  renderNozzleSection(kind);
}

/* ---------- sale calculation ---------- */
function calcSale(){
  const opening = getOpening();
  const closing = getClosing();
  const fuelReady = opening.saved && closing.saved;
  let petrol=0, diesel=0;
  if(fuelReady){
    for(let i=0;i<4;i++){
      let vol = num(closing.values[i]) - num(opening.values[i]);
      if(vol < 0) vol = 0;
      const amt = vol * RATES[i];
      if(FUEL[i] === "Petrol") petrol += amt; else diesel += amt;
    }
  }
  const oilMl = num(getOilMl());
  const oilAmount = (oilMl/1000) * OIL_RATE_PER_LITER;
  const sale = petrol + diesel + oilAmount;
  return {ready: fuelReady, sale, petrol, diesel, oilAmount};
}

/* ---------- collections / tags ---------- */
function toggleAddForm(){
  const f = document.getElementById("addForm");
  f.classList.toggle("hidden");
  if(!f.classList.contains("hidden")){
    document.getElementById("entryAmount").value = "";
    document.getElementById("entryTag").value = "";
    document.getElementById("tagSuggestions").classList.add("hidden");
  }
}

function onTagInput(){
  const input = document.getElementById("entryTag");
  const val = input.value.trim().toLowerCase();
  const box = document.getElementById("tagSuggestions");
  if(!val){ box.classList.add("hidden"); box.innerHTML=""; return; }
  const tags = getTags();
  const matches = tags.filter(t => t.toLowerCase().includes(val));
  if(matches.length === 0){ box.classList.add("hidden"); box.innerHTML=""; return; }
  box.innerHTML = matches.map(t => `<div onclick="selectTag('${t.replace(/'/g,"\\'")}')">${t}</div>`).join("");
  box.classList.remove("hidden");
}
function selectTag(t){
  document.getElementById("entryTag").value = t;
  const box = document.getElementById("tagSuggestions");
  box.classList.add("hidden");
  box.innerHTML = "";
}
document.addEventListener("click", function(e){
  const wrap = document.querySelector(".tag-input-wrap");
  if(wrap && !wrap.contains(e.target)){
    document.getElementById("tagSuggestions")?.classList.add("hidden");
  }
});

function addEntry(){
  const amount = num(document.getElementById("entryAmount").value);
  let tagRaw = document.getElementById("entryTag").value.trim();
  if(amount <= 0 || !tagRaw){ alert("Please enter a valid amount and tag."); return; }

  const tags = getTags();
  const existing = tags.find(t => t.toLowerCase() === tagRaw.toLowerCase());
  const finalTag = existing ? existing : tagRaw;
  if(!existing){
    tags.push(finalTag);
    setTags(tags);
  }

  const collections = getCollections();
  collections.push({ id: Date.now() + "_" + Math.random().toString(36).slice(2,7), amount, tag: finalTag, time: new Date().toISOString() });
  setCollections(collections);

  document.getElementById("addForm").classList.add("hidden");
  renderAll();
}

function toggleTag(tag){
  tagExpanded[tag] = !tagExpanded[tag];
  renderTagsList();
}

function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}

function renderTagsList(){
  const collections = getCollections();
  const tags = getTags();
  const container = document.getElementById("tagsList");

  const order = [];
  tags.forEach(t => { if(collections.some(c=>c.tag===t)) order.push(t); });
  collections.forEach(c => { if(!order.includes(c.tag)) order.push(c.tag); });

  if(order.length === 0){
    container.innerHTML = `<div class="result sub" style="margin-top:8px">No entries yet.</div>`;
    return;
  }

  container.innerHTML = order.map(tag => {
    const entries = collections.filter(c => c.tag === tag);
    const total = entries.reduce((s,e)=>s+e.amount,0);
    const expanded = !!tagExpanded[tag];
    let body = "";
    entries.forEach(e => {
      if(editingId === e.id){
        body += `<div class="edit-row">
          <input type="number" step="0.01" id="edit_amount_${e.id}" value="${e.amount}">
          <input type="text" id="edit_tag_${e.id}" value="${e.tag}">
          <span onclick="saveEdit('${e.id}')" style="cursor:pointer">✅</span>
          <span onclick="cancelEdit()" style="cursor:pointer">❌</span>
        </div>`;
      } else {
        body += `<div class="entry-row">
          <div class="entry-left">₹ ${fmt(e.amount)}<span class="entry-time">${fmtTime(e.time)}</span></div>
          <div class="entry-icons">
            <span onclick="editEntry('${e.id}')">✏️</span>
            <span onclick="deleteEntry('${e.id}')">🗑️</span>
          </div>
        </div>`;
      }
    });
    return `<div class="tag-row">
      <div class="tag-header" onclick="toggleTag('${tag.replace(/'/g,"\\'")}')">
        <span>${tag} ₹ ${fmt(total)}</span>
        <span class="arrow ${expanded ? 'open' : ''}">▸</span>
      </div>
      <div class="tag-body ${expanded ? '' : 'hidden'}">${body}</div>
    </div>`;
  }).join("");
}

function editEntry(id){
  editingId = id;
  renderTagsList();
}
function cancelEdit(){
  editingId = null;
  renderTagsList();
}
function saveEdit(id){
  const amount = num(document.getElementById(`edit_amount_${id}`).value);
  let tagRaw = document.getElementById(`edit_tag_${id}`).value.trim();
  if(amount <= 0 || !tagRaw){ alert("Please enter a valid amount and tag."); return; }

  const tags = getTags();
  const existing = tags.find(t => t.toLowerCase() === tagRaw.toLowerCase());
  const finalTag = existing ? existing : tagRaw;
  if(!existing){ tags.push(finalTag); setTags(tags); }

  const collections = getCollections();
  const idx = collections.findIndex(c => c.id === id);
  if(idx > -1){
    collections[idx].amount = amount;
    collections[idx].tag = finalTag;
    setCollections(collections);
  }
  editingId = null;
  renderAll();
}
function deleteEntry(id){
  if(!confirm("Delete this entry?")) return;
  let collections = getCollections();
  collections = collections.filter(c => c.id !== id);
  setCollections(collections);
  renderAll();
}

/* ---------- totals & status ---------- */
function renderTotals(){
  const saleData = calcSale();
  document.getElementById("sale").textContent = fmt(saleData.sale);
  const bd = document.getElementById("saleBreakdown");
  const parts = [];
  if(saleData.ready){
    parts.push(`Petrol: ₹ ${fmt(saleData.petrol)}`);
    parts.push(`Diesel: ₹ ${fmt(saleData.diesel)}`);
  }
  if(saleData.oilAmount > 0){ parts.push(`Oil: ₹ ${fmt(saleData.oilAmount)}`); }
  bd.textContent = parts.length
    ? parts.join("   |   ")
    : "Enter & save both Opening and Closing readings to calculate sale.";

  const collections = getCollections();
  let collected = collections.reduce((s,e)=>s+e.amount,0);
  const testingOn = getTesting();
  if(testingOn) collected += TESTING_AMOUNT;
  document.getElementById("collected").textContent = fmt(collected);

  const note = document.getElementById("testingNote");
  note.textContent = testingOn ? `(includes Testing: ₹ ${fmt(TESTING_AMOUNT)})` : "";

  const diff = collected - saleData.sale;
  const s = document.getElementById("status");
  if(diff > 0){
    s.className = "result excess";
    s.innerHTML = "🟢 Excess: ₹ " + fmt(diff);
  } else if(diff < 0){
    s.className = "result short";
    s.innerHTML = "🔴 Short: ₹ " + fmt(Math.abs(diff));
  } else {
    s.className = "result";
    s.innerHTML = "✅ Perfect Balance";
  }
}

/* ---------- clear ---------- */
function clearData(){
  if(!confirm("Clear today's data? (Tags list will be kept)")) return;
  localStorage.removeItem("pumpOpening");
  localStorage.removeItem("pumpClosing");
  localStorage.removeItem("pumpCollections");
  localStorage.removeItem("pumpOilMl");
  document.getElementById("oilMl").value = "";
  openingExpanded = false;
  closingExpanded = false;
  tagExpanded = {};
  editingId = null;
  renderAll();
}

/* ---------- oil sale + testing toggle (static controls, init once) ---------- */
function initMiscInputs(){
  const oilInput = document.getElementById("oilMl");
  const oilVal = getOilMl();
  oilInput.value = oilVal ? oilVal : "";
  oilInput.oninput = () => {
    setOilMl(num(oilInput.value));
    renderTotals();
  };

  const testInput = document.getElementById("testingToggle");
  testInput.checked = getTesting();
  testInput.onchange = () => {
    setTesting(testInput.checked);
    renderTotals();
  };
}

/* ---------- master render ---------- */
function renderAll(){
  renderNozzleSection("opening");
  renderNozzleSection("closing");
  renderTagsList();
  renderTotals();
}
renderAll();
initMiscInputs();


/* =========================================================
   COMPACT OPENING / CLOSING / TESTING
   Buttons stay in ONE LINE.
   Clicking them opens the ORIGINAL nozzle layout.
========================================================= */

(function(){

  const opening = document.getElementById("openingSection");
  const closing = document.getElementById("closingSection");
  const testingToggle = document.getElementById("testingToggle");

  if(!opening || !closing || !testingToggle) return;


  /* ---------- CSS ---------- */

  const style = document.createElement("style");

  style.textContent = `

    /* One-line control bar */
    #compactPumpBar{
      display:grid;
      grid-template-columns:1fr 1fr auto;
      align-items:center;
      gap:6px;
      margin-top:14px;
    }

    /* Opening / Closing button */
    .compact-pump-btn{
      border:1px solid #e5e5e5;
      background:#fafafa;
      border-radius:7px;
      min-height:42px;
      padding:7px 9px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:4px;
      cursor:pointer;
      font-weight:bold;
      font-size:.85em;
      user-select:none;
    }

    .compact-pump-btn:active{
      background:#eef2ff;
    }

    .compact-pump-arrow{
      color:#777;
      font-size:.75em;
      transition:.15s;
    }

    .compact-pump-arrow.open{
      transform:rotate(90deg);
    }

    /* Testing */
    .compact-testing{
      min-height:42px;
      padding:0 7px;
      border:1px solid #e5e5e5;
      background:#fafafa;
      border-radius:7px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
      font-weight:bold;
      font-size:.78em;
      white-space:nowrap;
    }

    /* IMPORTANT:
       When nozzle layout is OPEN,
       restore original layout completely.
    */

    #compactPumpBar .original-nozzle-layout{
      grid-column:1 / -1;
      width:100%;
    }

    #compactPumpBar .original-nozzle-layout .section{
      margin-top:0;
    }

    /* Keep original grid exactly as before */
    #compactPumpBar .original-nozzle-layout .grid4{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    #compactPumpBar .original-nozzle-layout .nozzle-box{
      background:#fafafa;
      border-radius:6px;
      padding:8px;
    }

    #compactPumpBar .original-nozzle-layout .nozzle-box label{
      margin-top:0;
    }

    /* Testing switch */
    .compact-testing .switch{
      width:38px;
      height:21px;
      margin:0;
    }

    .compact-testing .slider:before{
      width:15px;
      height:15px;
      left:3px;
      bottom:3px;
    }

    .compact-testing input:checked + .slider:before{
      transform:translateX(17px);
    }

    @media(max-width:380px){

      #compactPumpBar{
        gap:3px;
      }

      .compact-pump-btn{
        padding:6px 5px;
        font-size:.78em;
      }

      .compact-testing{
        padding:0 4px;
        font-size:.7em;
      }

    }

  `;

  document.head.appendChild(style);


  /* ---------- Save original renderer ---------- */

  const originalRenderNozzleSection =
    window.renderNozzleSection;


  /* ---------- State ---------- */

  let openPanel = null;


  /* ---------- Create compact button ---------- */

  function createButton(kind){

    const isOpening =
      kind === "opening";

    const icon =
      isOpening ? "🔓" : "🔒";

    const text =
      isOpening ? "Opening" : "Closing";

    const button =
      document.createElement("div");

    button.className =
      "compact-pump-btn";

    button.innerHTML = `
      <span>${icon}</span>
      <span>${text}</span>
      <span class="compact-pump-arrow ${
        openPanel === kind ? "open" : ""
      }">▸</span>
    `;

    button.onclick = function(){

      if(openPanel === kind){

        openPanel = null;

      }else{

        openPanel = kind;

      }

      renderCompact();

    };

    return button;

  }


  /* ---------- Render original nozzle layout ---------- */

  function renderOriginal(kind, target){

    /*
      Temporarily use the original renderer.

      This means the nozzle fields are generated
      exactly like your old code.
    */

    originalRenderNozzleSection(kind);

    const source =
      document.getElementById(
        kind === "opening"
          ? "openingSection"
          : "closingSection"
      );

    if(source){

      source.classList.add(
        "original-nozzle-layout"
      );

      target.replaceWith(source);

    }

  }


  /* ---------- Main render ---------- */

  function renderCompact(){

    const oldOpening =
      document.getElementById(
        "openingSection"
      );

    const oldClosing =
      document.getElementById(
        "closingSection"
      );


    /* Create / reuse wrapper */

    let bar =
      document.getElementById(
        "compactPumpBar"
      );


    if(!bar){

      bar =
        document.createElement("div");

      bar.id =
        "compactPumpBar";

      /*
        Put bar before Opening section.
      */

      oldOpening.parentNode.insertBefore(
        bar,
        oldOpening
      );

    }


    /* Clear current content */

    bar.innerHTML = "";


    /* ---------- Opening ---------- */

    if(openPanel === "opening"){

      const holder =
        document.createElement("div");

      holder.id =
        "openingSection";

      bar.appendChild(holder);

      renderOriginal(
        "opening",
        holder
      );

    }else{

      const btn =
        createButton("opening");

      bar.appendChild(btn);

    }


    /* ---------- Closing ---------- */

    if(openPanel === "closing"){

      const holder =
        document.createElement("div");

      holder.id =
        "closingSection";

      bar.appendChild(holder);

      renderOriginal(
        "closing",
        holder
      );

    }else{

      const btn =
        createButton("closing");

      bar.appendChild(btn);

    }


    /* ---------- Testing ---------- */

    const testing =
      document.createElement("div");

    testing.className =
      "compact-testing";

    testing.innerHTML = `
      <span>🧪</span>
      <label
        class="switch"
        style="margin:0"
      >
        <input
          type="checkbox"
          id="testingToggle"
          ${getTesting() ? "checked" : ""}
        >
        <span class="slider"></span>
      </label>
    `;

    bar.appendChild(testing);


    /* Testing event */

    const newToggle =
      testing.querySelector(
        "#testingToggle"
      );

    newToggle.onchange = function(){

      setTesting(
        newToggle.checked
      );

      renderTotals();

    };

  }


  /* =======================================================
     OVERRIDE renderNozzleSection

     When our compact UI is active, don't let renderAll()
     destroy the compact layout.
  ======================================================= */

  window.renderNozzleSection =
    function(kind){

      if(
        document.getElementById(
          "compactPumpBar"
        )
      ){

        renderCompact();

      }else{

        originalRenderNozzleSection(
          kind
        );

      }

    };


  /* ---------- Initial conversion ---------- */

  /*
    Remove the old separate Testing section.
  */

  const testingSection =
    testingToggle.closest(".section");

  if(testingSection){
    testingSection.remove();
  }


  /*
    Remove old Opening / Closing containers
    after taking their place.
  */

  opening.remove();
  closing.remove();


  /* ---------- Build compact UI ---------- */

  const bar =
    document.createElement("div");

  bar.id =
    "compactPumpBar";


  /*
    Put it where Opening originally was.
  */

  const sale =
    document.getElementById("sale");

  const saleResult =
    sale?.closest(".result");

  if(saleResult){

    saleResult.parentNode.insertBefore(
      bar,
      saleResult
    );

  }else{

    document
      .querySelector(".container")
      .appendChild(bar);

  }


  /* ---------- First render ---------- */

  renderCompact();

})();
</script>
</body>
</html>
