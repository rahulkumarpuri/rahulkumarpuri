<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petrol Pump Short / Excess</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:20px}
.container{max-width:500px;margin:auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
h2{text-align:center;margin-top:0}
h3{margin-bottom:6px}
label{display:block;margin-top:10px;font-weight:bold;font-size:.9em}
input[type=number],input[type=text]{width:100%;padding:10px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;margin-top:4px}
.result{margin-top:15px;padding:10px;background:#f7f7f7;border-radius:6px;font-weight:bold}
.result.sub{font-weight:normal;font-size:.85em;color:#555;margin-top:6px;background:none;padding:0}
.short{color:#c00}
.excess{color:#090}
.btn{width:100%;padding:10px;margin-top:12px;border:none;border-radius:6px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
.btn.secondary{background:#555}
.btn.small{width:auto;padding:6px 12px;margin-top:0;font-size:.85em}
.section{margin-top:14px;border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px}
.toggle-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:bold}
.arrow{transition:transform .15s;font-size:.9em}
.arrow.open{transform:rotate(90deg)}
.locked-note{font-size:.8em;color:#777;font-weight:normal}
.tag-input-wrap{position:relative}
.suggestions{position:absolute;left:0;right:0;background:#fff;border:1px solid #ccc;border-top:none;border-radius:0 0 6px 6px;max-height:150px;overflow-y:auto;z-index:10}
.suggestions div{padding:8px 10px;cursor:pointer;font-size:.9em}
.suggestions div:hover{background:#eef2ff}
.tag-row{border:1px solid #e5e5e5;border-radius:6px;margin-top:8px;overflow:hidden}
.tag-header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;cursor:pointer;background:#fafafa}
.tag-body{padding:0 12px}
.entry-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #eee;font-size:.9em}
.entry-row:first-child{border-top:none}
.entry-left{color:#333}
.entry-time{color:#999;font-size:.8em;display:block}
.entry-icons span{cursor:pointer;margin-left:8px;font-size:1em}
.edit-row{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid #eee;flex-wrap:wrap}
.edit-row input{width:auto;flex:1;padding:6px;margin-top:0;min-width:80px}
.hidden{display:none !important}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nozzle-box{background:#fafafa;border-radius:6px;padding:8px}
.nozzle-box label{margin-top:0}
.row-flex{display:flex;justify-content:space-between;align-items:center}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;transition:.2s;border-radius:24px}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background-color:#fff;transition:.2s;border-radius:50%}
input:checked + .slider{background-color:#2563eb}
input:checked + .slider:before{transform:translateX(20px)}
</style>
</head>
<body>
<div class="container">
<h2>Petrol Pump Short / Excess</h2>

<div id="openingSection"></div>
<div id="closingSection"></div>

<div class="result">Today's Sale: ₹ <span id="sale">0.00</span></div>
<div class="result sub" id="saleBreakdown"></div>

<div class="section">
  <label style="margin-top:0">Total Oil Sale (ml)</label>
  <input type="number" step="1" id="oilMl" placeholder="0">
</div>

<div class="section row-flex">
  <span style="font-weight:bold">TESTING</span>
  <label class="switch">
    <input type="checkbox" id="testingToggle">
    <span class="slider"></span>
  </label>
</div>

<h3 style="margin-top:20px">Collections</h3>
<button class="btn" id="addEntryBtn" onclick="toggleAddForm()">+ Add Entry</button>
<div id="addForm" class="hidden">
  <label>Amount</label>
  <input type="number" step="0.01" id="entryAmount" placeholder="0.00">
  <label>Tags</label>
  <div class="tag-input-wrap">
    <input type="text" id="entryTag" autocomplete="off" placeholder="Type a tag...">
    <div id="tagSuggestions" class="suggestions hidden"></div>
  </div>
  <button class="btn" onclick="addEntry()">Add</button>
</div>

<div id="tagsList"></div>

<div class="result">Collected: ₹ <span id="collected">0.00</span></div>
<div class="result sub" id="testingNote"></div>
<div class="result" id="status">Difference: ₹0.00</div>

<button class="btn secondary" onclick="clearData()">Clear Today's Data</button>
</div>

<script>
/* ---------- constants ---------- */
const RATES = [114.28, 103.19, 114.28, 103.19]; // nozzle 1,2,3,4 (index 0-3)
const FUEL  = ["Petrol","Diesel","Petrol","Diesel"];
const DEFAULT_TAGS = ["Card","Credit Vehicles","Test","Deposited Cash","Phonepe","Cash","Coin"];
const OIL_RATE_PER_LITER = 400;
const TESTING_AMOUNT = 2174.7;
const todayStr = new Date().toISOString().slice(0,10);

/* ---------- storage helpers ---------- */
function getJSON(key, def){
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : def;
  }catch(e){ return def; }
}
function setJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

function ensureDay(){
  const storedDay = localStorage.getItem("pumpDay");
  if(storedDay !== todayStr){
    localStorage.removeItem("pumpOpening");
    localStorage.removeItem("pumpClosing");
    localStorage.removeItem("pumpCollections");
    localStorage.removeItem("pumpOilMl");
    localStorage.setItem("pumpDay", todayStr);
  }
  if(!localStorage.getItem("pumpTags")){
    setJSON("pumpTags", DEFAULT_TAGS);
  }
}
ensureDay();

function getOpening(){ return getJSON("pumpOpening", {saved:false, values:[null,null,null,null]}); }
function setOpening(d){ setJSON("pumpOpening", d); }
function getClosing(){ return getJSON("pumpClosing", {saved:false, values:[null,null,null,null]}); }
function setClosing(d){ setJSON("pumpClosing", d); }
function getCollections(){ return getJSON("pumpCollections", []); }
function setCollections(a){ setJSON("pumpCollections", a); }
function getTags(){ return getJSON("pumpTags", DEFAULT_TAGS.slice()); }
function setTags(a){ setJSON("pumpTags", a); }
function getOilMl(){ return getJSON("pumpOilMl", 0); }
function setOilMl(v){ setJSON("pumpOilMl", v); }
function getTesting(){ return getJSON("pumpTestingOn", false); }
function setTesting(v){ setJSON("pumpTestingOn", v); }

/* ---------- transient UI state (resets each page load) ---------- */
let openingExpanded = false;
let closingExpanded = false;
let tagExpanded = {};
let editingId = null;
let editBuffer = {amount:"", tag:""};

/* ---------- formatting ---------- */
function fmt(x){ return (x||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }

/* ---------- rendering: opening / closing nozzle sections ---------- */
function renderNozzleSection(kind){
  const containerId = kind === "opening" ? "openingSection" : "closingSection";
  const label = kind === "opening" ? "Opening CumVolume" : "Closing CumVolume";
  const data = kind === "opening" ? getOpening() : getClosing();
  const expanded = kind === "opening" ? openingExpanded : closingExpanded;
  const container = document.getElementById(containerId);

  if(!data.saved){
    let boxes = "";
    for(let i=0;i<4;i++){
      const v = data.values[i] !== null && data.values[i] !== undefined ? data.values[i] : "";
      boxes += `<div class="nozzle-box">
        <label>Nozzle ${i+1} (${FUEL[i]})</label>
        <input type="number" step="0.001" id="${kind}_${i}" value="${v}">
      </div>`;
    }
    container.innerHTML = `
      <div class="section">
        <h3 style="margin-top:0">${label}</h3>
        <div class="grid4">${boxes}</div>
        <button class="btn" onclick="save${cap(kind)}()">Save ${label}</button>
      </div>`;
  } else {
    let boxes = "";
    for(let i=0;i<4;i++){
      boxes += `<div class="nozzle-box">
        <label>Nozzle ${i+1} (${FUEL[i]})</label>
        <input type="number" step="0.001" id="${kind}_${i}" value="${data.values[i]}">
      </div>`;
    }
    container.innerHTML = `
      <div class="section">
        <div class="toggle-header" onclick="toggleNozzle('${kind}')">
          <span>${label} <span class="locked-note">(saved)</span></span>
          <span class="arrow ${expanded ? 'open' : ''}">▸</span>
        </div>
        <div class="${expanded ? '' : 'hidden'}" style="margin-top:10px">
          <div class="grid4">${boxes}</div>
          <button class="btn" onclick="update${cap(kind)}()">Update ${label}</button>
        </div>
      </div>`;
  }
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function readNozzleInputs(kind){
  const vals = [];
  for(let i=0;i<4;i++){
    const el = document.getElementById(`${kind}_${i}`);
    vals.push(el ? num(el.value) : 0);
  }
  return vals;
}

function saveOpening(){
  const vals = readNozzleInputs("opening");
  setOpening({saved:true, values:vals});
  openingExpanded = false;
  renderAll();
}
function updateOpening(){
  const vals = readNozzleInputs("opening");
  setOpening({saved:true, values:vals});
  openingExpanded = false;
  renderAll();
}
function saveClosing(){
  const vals = readNozzleInputs("closing");
  setClosing({saved:true, values:vals});
  closingExpanded = false;
  renderAll();
}
function updateClosing(){
  const vals = readNozzleInputs("closing");
  setClosing({saved:true, values:vals});
  closingExpanded = false;
  renderAll();
}
function toggleNozzle(kind){
  if(kind === "opening") openingExpanded = !openingExpanded;
  else closingExpanded = !closingExpanded;
  renderNozzleSection(kind);
}

/* ---------- sale calculation ---------- */
function calcSale(){
  const opening = getOpening();
  const closing = getClosing();
  const fuelReady = opening.saved && closing.saved;
  let petrol=0, diesel=0;
  if(fuelReady){
    for(let i=0;i<4;i++){
      let vol = num(closing.values[i]) - num(opening.values[i]);
      if(vol < 0) vol = 0;
      const amt = vol * RATES[i];
      if(FUEL[i] === "Petrol") petrol += amt; else diesel += amt;
    }
  }
  const oilMl = num(getOilMl());
  const oilAmount = (oilMl/1000) * OIL_RATE_PER_LITER;
  const sale = petrol + diesel + oilAmount;
  return {ready: fuelReady, sale, petrol, diesel, oilAmount};
}

/* ---------- collections / tags ---------- */
function toggleAddForm(){
  const f = document.getElementById("addForm");
  f.classList.toggle("hidden");
  if(!f.classList.contains("hidden")){
    document.getElementById("entryAmount").value = "";
    document.getElementById("entryTag").value = "";
    document.getElementById("tagSuggestions").classList.add("hidden");
  }
}

function onTagInput(){
  const input = document.getElementById("entryTag");
  const val = input.value.trim().toLowerCase();
  const box = document.getElementById("tagSuggestions");
  if(!val){ box.classList.add("hidden"); box.innerHTML=""; return; }
  const tags = getTags();
  const matches = tags.filter(t => t.toLowerCase().includes(val));
  if(matches.length === 0){ box.classList.add("hidden"); box.innerHTML=""; return; }
  box.innerHTML = matches.map(t => `<div onclick="selectTag('${t.replace(/'/g,"\\'")}')">${t}</div>`).join("");
  box.classList.remove("hidden");
}
function selectTag(t){
  document.getElementById("entryTag").value = t;
  const box = document.getElementById("tagSuggestions");
  box.classList.add("hidden");
  box.innerHTML = "";
}
document.addEventListener("click", function(e){
  const wrap = document.querySelector(".tag-input-wrap");
  if(wrap && !wrap.contains(e.target)){
    document.getElementById("tagSuggestions")?.classList.add("hidden");
  }
});

function addEntry(){
  const amount = num(document.getElementById("entryAmount").value);
  let tagRaw = document.getElementById("entryTag").value.trim();
  if(amount <= 0 || !tagRaw){ alert("Please enter a valid amount and tag."); return; }

  const tags = getTags();
  const existing = tags.find(t => t.toLowerCase() === tagRaw.toLowerCase());
  const finalTag = existing ? existing : tagRaw;
  if(!existing){
    tags.push(finalTag);
    setTags(tags);
  }

  const collections = getCollections();
  collections.push({ id: Date.now() + "_" + Math.random().toString(36).slice(2,7), amount, tag: finalTag, time: new Date().toISOString() });
  setCollections(collections);

  document.getElementById("addForm").classList.add("hidden");
  renderAll();
}

function toggleTag(tag){
  tagExpanded[tag] = !tagExpanded[tag];
  renderTagsList();
}

function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}

function renderTagsList(){
  const collections = getCollections();
  const tags = getTags();
  const container = document.getElementById("tagsList");

  const order = [];
  tags.forEach(t => { if(collections.some(c=>c.tag===t)) order.push(t); });
  collections.forEach(c => { if(!order.includes(c.tag)) order.push(c.tag); });

  if(order.length === 0){
    container.innerHTML = `<div class="result sub" style="margin-top:8px">No entries yet.</div>`;
    return;
  }

  container.innerHTML = order.map(tag => {
    const entries = collections.filter(c => c.tag === tag);
    const total = entries.reduce((s,e)=>s+e.amount,0);
    const expanded = !!tagExpanded[tag];
    let body = "";
    entries.forEach(e => {
      if(editingId === e.id){
        body += `<div class="edit-row">
          <input type="number" step="0.01" id="edit_amount_${e.id}" value="${e.amount}">
          <input type="text" id="edit_tag_${e.id}" value="${e.tag}">
          <span onclick="saveEdit('${e.id}')" style="cursor:pointer">✅</span>
          <span onclick="cancelEdit()" style="cursor:pointer">❌</span>
        </div>`;
      } else {
        body += `<div class="entry-row">
          <div class="entry-left">₹ ${fmt(e.amount)}<span class="entry-time">${fmtTime(e.time)}</span></div>
          <div class="entry-icons">
            <span onclick="editEntry('${e.id}')">✏️</span>
            <span onclick="deleteEntry('${e.id}')">🗑️</span>
          </div>
        </div>`;
      }
    });
    return `<div class="tag-row">
      <div class="tag-header" onclick="toggleTag('${tag.replace(/'/g,"\\'")}')">
        <span>${tag} ₹ ${fmt(total)}</span>
        <span class="arrow ${expanded ? 'open' : ''}">▸</span>
      </div>
      <div class="tag-body ${expanded ? '' : 'hidden'}">${body}</div>
    </div>`;
  }).join("");
}

function editEntry(id){
  editingId = id;
  renderTagsList();
}
function cancelEdit(){
  editingId = null;
  renderTagsList();
}
function saveEdit(id){
  const amount = num(document.getElementById(`edit_amount_${id}`).value);
  let tagRaw = document.getElementById(`edit_tag_${id}`).value.trim();
  if(amount <= 0 || !tagRaw){ alert("Please enter a valid amount and tag."); return; }

  const tags = getTags();
  const existing = tags.find(t => t.toLowerCase() === tagRaw.toLowerCase());
  const finalTag = existing ? existing : tagRaw;
  if(!existing){ tags.push(finalTag); setTags(tags); }

  const collections = getCollections();
  const idx = collections.findIndex(c => c.id === id);
  if(idx > -1){
    collections[idx].amount = amount;
    collections[idx].tag = finalTag;
    setCollections(collections);
  }
  editingId = null;
  renderAll();
}
function deleteEntry(id){
  if(!confirm("Delete this entry?")) return;
  let collections = getCollections();
  collections = collections.filter(c => c.id !== id);
  setCollections(collections);
  renderAll();
}

/* ---------- totals & status ---------- */
function renderTotals(){
  const saleData = calcSale();
  document.getElementById("sale").textContent = fmt(saleData.sale);
  const bd = document.getElementById("saleBreakdown");
  const parts = [];
  if(saleData.ready){
    parts.push(`Petrol: ₹ ${fmt(saleData.petrol)}`);
    parts.push(`Diesel: ₹ ${fmt(saleData.diesel)}`);
  }
  if(saleData.oilAmount > 0){ parts.push(`Oil: ₹ ${fmt(saleData.oilAmount)}`); }
  bd.textContent = parts.length
    ? parts.join("   |   ")
    : "Enter & save both Opening and Closing readings to calculate sale.";

  const collections = getCollections();
  let collected = collections.reduce((s,e)=>s+e.amount,0);
  const testingOn = getTesting();
  if(testingOn) collected += TESTING_AMOUNT;
  document.getElementById("collected").textContent = fmt(collected);

  const note = document.getElementById("testingNote");
  note.textContent = testingOn ? `(includes Testing: ₹ ${fmt(TESTING_AMOUNT)})` : "";

  const diff = collected - saleData.sale;
  const s = document.getElementById("status");
  if(diff > 0){
    s.className = "result excess";
    s.innerHTML = "🟢 Excess: ₹ " + fmt(diff);
  } else if(diff < 0){
    s.className = "result short";
    s.innerHTML = "🔴 Short: ₹ " + fmt(Math.abs(diff));
  } else {
    s.className = "result";
    s.innerHTML = "✅ Perfect Balance";
  }
}

/* ---------- clear ---------- */
function clearData(){
  if(!confirm("Clear today's data? (Tags list will be kept)")) return;
  localStorage.removeItem("pumpOpening");
  localStorage.removeItem("pumpClosing");
  localStorage.removeItem("pumpCollections");
  localStorage.removeItem("pumpOilMl");
  document.getElementById("oilMl").value = "";
  openingExpanded = false;
  closingExpanded = false;
  tagExpanded = {};
  editingId = null;
  renderAll();
}

/* ---------- oil sale + testing toggle (static controls, init once) ---------- */
function initMiscInputs(){
  const oilInput = document.getElementById("oilMl");
  const oilVal = getOilMl();
  oilInput.value = oilVal ? oilVal : "";
  oilInput.oninput = () => {
    setOilMl(num(oilInput.value));
    renderTotals();
  };

  const testInput = document.getElementById("testingToggle");
  testInput.checked = getTesting();
  testInput.onchange = () => {
    setTesting(testInput.checked);
    renderTotals();
  };
}

/* ---------- master render ---------- */
function renderAll(){
  renderNozzleSection("opening");
  renderNozzleSection("closing");
  renderTagsList();
  renderTotals();
}
renderAll();
initMiscInputs();


/* =========================================================
   HAMBURGER MENU
   Opening / Closing / Today's Sale moved into menu
========================================================= */

(function(){

  const opening = document.getElementById("openingSection");
  const closing = document.getElementById("closingSection");
  const sale = document.getElementById("sale");

  if(!opening || !closing || !sale) return;


  /* =======================================================
     CSS
  ======================================================= */

  const style = document.createElement("style");

  style.textContent = `

    /* Hamburger button */
    #pumpMenuBtn{
      position:fixed;
      top:14px;
      right:14px;
      width:42px;
      height:42px;
      border:none;
      border-radius:8px;
      background:#2563eb;
      color:#fff;
      font-size:22px;
      cursor:pointer;
      z-index:9998;
      box-shadow:0 2px 7px rgba(0,0,0,.2);
    }

    /* Dark overlay */
    #pumpMenuOverlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.35);
      z-index:9999;
      display:none;
    }

    #pumpMenuOverlay.open{
      display:block;
    }

    /* Side menu */
    #pumpMenu{
      position:fixed;
      top:0;
      right:0;
      width:min(430px,92vw);
      height:100vh;
      background:#fff;
      z-index:10000;
      box-shadow:-4px 0 15px rgba(0,0,0,.2);
      transform:translateX(100%);
      transition:transform .2s ease;
      overflow-y:auto;
    }

    #pumpMenu.open{
      transform:translateX(0);
    }

    /* Menu header */
    .pump-menu-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px;
      border-bottom:1px solid #eee;
      background:#fafafa;
    }

    .pump-menu-title{
      font-size:1.05em;
      font-weight:bold;
    }

    #pumpMenuClose{
      border:none;
      background:none;
      font-size:22px;
      cursor:pointer;
      padding:2px 5px;
    }

    /* Menu content */
    .pump-menu-content{
      padding:12px;
    }

    .pump-menu-content .section{
      margin-top:10px;
    }

    /* Today's Sale */
    .menu-sale{
      padding:12px;
      background:#f7f7f7;
      border-radius:8px;
      margin-bottom:12px;
    }

    .menu-sale-title{
      font-weight:bold;
      margin-bottom:5px;
    }

    .menu-sale-amount{
      font-size:1.35em;
      font-weight:bold;
    }

    .menu-sale-breakdown{
      font-size:.82em;
      color:#666;
      margin-top:5px;
      line-height:1.5;
    }

    /* Menu section headings */
    .menu-section-title{
      font-weight:bold;
      font-size:.95em;
      margin-bottom:7px;
    }

    /* Hide original main-page containers */
    #openingSection.main-hidden,
    #closingSection.main-hidden,
    #mainSaleResult.main-hidden{
      display:none !important;
    }

    /* Mobile */
    @media(max-width:500px){

      #pumpMenuBtn{
        top:10px;
        right:10px;
      }

    }

  `;

  document.head.appendChild(style);


  /* =======================================================
     HAMBURGER BUTTON
  ======================================================= */

  const menuBtn =
    document.createElement("button");

  menuBtn.id = "pumpMenuBtn";

  menuBtn.innerHTML = "☰";

  menuBtn.title = "Menu";

  document.body.appendChild(menuBtn);


  /* =======================================================
     OVERLAY
  ======================================================= */

  const overlay =
    document.createElement("div");

  overlay.id =
    "pumpMenuOverlay";

  document.body.appendChild(
    overlay
  );


  /* =======================================================
     MENU
  ======================================================= */

  const menu =
    document.createElement("div");

  menu.id =
    "pumpMenu";

  menu.innerHTML = `

    <div class="pump-menu-header">

      <span class="pump-menu-title">
        Petrol Pump Menu
      </span>

      <button id="pumpMenuClose">
        ❌
      </button>

    </div>

    <div class="pump-menu-content">

      <!-- Today's Sale -->

      <div class="menu-sale">

        <div class="menu-sale-title">
          💰 Today's Sale
        </div>

        <div class="menu-sale-amount">
          ₹ <span id="menuSale">0.00</span>
        </div>

        <div
          class="menu-sale-breakdown"
          id="menuSaleBreakdown"
        ></div>

      </div>


      <!-- Opening -->

      <div id="menuOpening"></div>


      <!-- Closing -->

      <div id="menuClosing"></div>

    </div>

  `;

  document.body.appendChild(menu);


  /* =======================================================
     OPEN / CLOSE MENU
  ======================================================= */

  function openMenu(){

    menu.classList.add("open");

    overlay.classList.add("open");

    menuBtn.style.display =
      "none";

    renderMenu();

  }


  function closeMenu(){

    menu.classList.remove("open");

    overlay.classList.remove("open");

    menuBtn.style.display =
      "block";

  }


  menuBtn.onclick =
    openMenu;

  overlay.onclick =
    closeMenu;

  document
    .getElementById("pumpMenuClose")
    .onclick =
      closeMenu;


  /* =======================================================
     MOVE ORIGINAL OPENING/CLOSING INTO MENU
  ======================================================= */

  const menuOpening =
    document.getElementById(
      "menuOpening"
    );

  const menuClosing =
    document.getElementById(
      "menuClosing"
    );


  /*
    Move the actual existing containers
    into the hamburger menu.

    Their original functions remain untouched.
  */

  menuOpening.appendChild(
    opening
  );

  menuClosing.appendChild(
    closing
  );


  /* =======================================================
     HIDE ORIGINAL TODAY'S SALE
  ======================================================= */

  const saleResult =
    sale.closest(".result");

  const saleBreakdown =
    document.getElementById(
      "saleBreakdown"
    );

  const saleBreakdownResult =
    saleBreakdown
      ? saleBreakdown.closest(".result")
      : null;


  /*
    Create a wrapper around the original
    sale elements so they can disappear
    from main screen.
  */

  if(saleResult){

    const saleWrapper =
      document.createElement("div");

    saleWrapper.id =
      "mainSaleResult";

    saleResult.parentNode.insertBefore(
      saleWrapper,
      saleResult
    );

    saleWrapper.appendChild(
      saleResult
    );

    if(saleBreakdownResult){

      saleWrapper.appendChild(
        saleBreakdownResult
      );

    }

    saleWrapper.classList.add(
      "main-hidden"
    );

  }


  /* =======================================================
     RENDER MENU SALE
  ======================================================= */

  function renderMenuSale(){

    const saleValue =
      document.getElementById(
        "sale"
      );

    const breakdown =
      document.getElementById(
        "saleBreakdown"
      );

    const menuSale =
      document.getElementById(
        "menuSale"
      );

    const menuBreakdown =
      document.getElementById(
        "menuSaleBreakdown"
      );

    if(!saleValue || !menuSale)
      return;

    menuSale.textContent =
      saleValue.textContent;

    if(breakdown){

      menuBreakdown.textContent =
        breakdown.textContent;

    }

  }


  /* =======================================================
     MENU RENDER
  ======================================================= */

  function renderMenu(){

    renderMenuSale();

    /*
      Re-apply hidden state because
      renderAll() may replace inner HTML.
    */

    const mainOpening =
      document.getElementById(
        "openingSection"
      );

    const mainClosing =
      document.getElementById(
        "closingSection"
      );

    if(mainOpening){

      menuOpening.appendChild(
        mainOpening
      );

    }

    if(mainClosing){

      menuClosing.appendChild(
        mainClosing
      );

    }

  }


  /* =======================================================
     KEEP SALE UPDATED
  ======================================================= */

  const originalRenderTotals =
    window.renderTotals;


  if(typeof originalRenderTotals === "function"){

    window.renderTotals =
      function(){

        originalRenderTotals();

        renderMenuSale();

      };

  }


  /* =======================================================
     KEEP OPENING/CLOSING INSIDE MENU
  ======================================================= */

  const originalRenderNozzleSection =
    window.renderNozzleSection;


  if(typeof originalRenderNozzleSection === "function"){

    window.renderNozzleSection =
      function(kind){

        /*
          Let original function render normally.
        */

        originalRenderNozzleSection(
          kind
        );


        /*
          Then immediately move the
          generated container back into menu.
        */

        const el =
          document.getElementById(
            kind === "opening"
              ? "openingSection"
              : "closingSection"
          );

        if(!el) return;

        if(kind === "opening"){

          menuOpening.appendChild(
            el
          );

        }else{

          menuClosing.appendChild(
            el
          );

        }

      };

  }


  /* =======================================================
     INITIAL STATE
  ======================================================= */

  /*
    Make sure Opening/Closing are
    inside menu immediately.
  */

  renderMenu();


})();

        </div>

      </div>

     RESTORE VALUES
  ------------------------------------------------------- */

    document.getElementById("oilMl");

    discountOilMl || "";

     TOTAL OIL INPUT
  ------------------------------------------------------- */

      num(this.value);

    setOilMl(value);

    renderTotals();

  /* -------------------------------------------------------
     DISCOUNT OIL INPUT
  ------------------------------------------------------- */

  discountOilInput.oninput = function(){

    const value =
      num(this.value);

    setDiscountOilMl(value);

    renderTotals();

  };

     UPGRADE calcSale()
     
     Existing fuel + existing oil
     + discount oil
  ------------------------------------------------------- */

  const originalCalcSale =
    window.calcSale;


  if(
    typeof originalCalcSale ===
    "function"
  ){

    window.calcSale = function(){

      const result =
        originalCalcSale();


      const discountMl =
        num(getDiscountOilMl());


      const discountOilAmount =
        (discountMl / 1000) *
        DISCOUNT_OIL_RATE_PER_LITER;


      result.discountOilAmount =
        discountOilAmount;


      result.sale =
        result.sale +

  ------------------------------------------------------- */

          t.toLowerCase() ===
          tag.toLowerCase()
      );

    if(!exists){

      tags.push(tag);

      setTags(tags);

    }

  }


  Object.values(
    QUICK_TAGS
  ).forEach(ensureTag);


  /* -------------------------------------------------------
     ADD MULTIPLE ENTRY
  ------------------------------------------------------- */

  function addQuickEntry(
    tag,
    inputId
  ){

    const input =
      document.getElementById(
        inputId
      );

    if(!input) return;


    const amount =
      num(input.value);


    if(amount <= 0){

      alert(
        "Please enter a valid amount."
      );

      return;

    }


    ensureTag(tag);


    const collections =
      getCollections();


    collections.push({

      id:makeId(),

      amount:amount,

      tag:tag,

      time:new Date().toISOString()

    });


    setCollections(
      collections
    );


    input.value = "";


    renderQuickArea();

    renderTagsList();

    renderTotals();

  }


  /* -------------------------------------------------------
     FIXED ENTRY
  ------------------------------------------------------- */

  function saveFixedEntry(
    tag,
    inputId
  ){

    const input =
      document.getElementById(
        inputId
      );

    if(!input) return;


    const amount =
      num(input.value);


    const collections =
      getCollections();


    const existingIndex =
      collections.findIndex(
        e => e.tag === tag
      );


    if(amount <= 0){

      if(existingIndex > -1){

        collections.splice(
          existingIndex,
          1
        );

        setCollections(
          collections
        );

      }

      renderQuickArea();
      renderTagsList();
      renderTotals();

      return;

    }


    ensureTag(tag);


    if(existingIndex > -1){

      collections[
        existingIndex
      ].amount = amount;

      collections[
        existingIndex
      ].time =
        new Date().toISOString();

    }else{

      collections.push({

        id:makeId(),

        amount:amount,

        tag:tag,

        time:new Date().toISOString()

      });

    }


    setCollections(
      collections
    );


    renderQuickArea();

    renderTagsList();

    renderTotals();

  }


  /* -------------------------------------------------------
     DELETE QUICK ENTRY
  ------------------------------------------------------- */

  function deleteQuickEntry(id){

    if(
      !confirm(
        "Delete this entry?"
      )
    ) return;


    let collections =
      getCollections();


    collections =
      collections.filter(
        e => e.id !== id
      );


    setCollections(
      collections
    );


    renderQuickArea();

    renderTagsList();

    renderTotals();

  }


  /* -------------------------------------------------------
     PHYSICAL CASH DATA
  ------------------------------------------------------- */

  const CASH_DENOMINATIONS =
    [500,100,50,20,10];


  function getCashNotes(){

    return qGet(
      "physicalCashNotes",
      {
        500:0,
        100:0,
        50:0,
        20:0,
        10:0
      }
    );

  }


  function calculatePhysicalCash(){

    const notes =
      getCashNotes();


    return (
      (num(notes[500]) * 500) +
      (num(notes[100]) * 100) +
      (num(notes[50])  * 50) +
      (num(notes[20])  * 20) +
      (num(notes[10])  * 10)
    );

  }


  function savePhysicalCash(){

    const notes = {};


    CASH_DENOMINATIONS.forEach(
      denomination => {

        const input =
          document.getElementById(
            "cashNote_" +
            denomination
          );


        notes[denomination] =
          input
            ? Math.max(
                0,
                Math.floor(
                  num(input.value)
                )
              )
            : 0;

      }
    );


    qSet(
      "physicalCashNotes",
      notes
    );


    const total =
      calculatePhysicalCash();


    ensureTag(
      QUICK_TAGS.cash
    );


    const collections =
      getCollections();


    const existingIndex =
      collections.findIndex(
        e =>
          e.tag ===
          QUICK_TAGS.cash
      );


    if(total > 0){

      if(existingIndex > -1){

        collections[
          existingIndex
        ].amount = total;

        collections[
          existingIndex
        ].time =
          new Date().toISOString();

      }else{

        collections.push({

          id:makeId(),

          amount:total,

          tag:QUICK_TAGS.cash,

          time:new Date().toISOString()

        });

      }

    }else{

      if(existingIndex > -1){

        collections.splice(
          existingIndex,
          1
        );

      }

    }


    setCollections(
      collections
    );


    renderQuickArea();

    renderTagsList();

    renderTotals();

  }


  /* -------------------------------------------------------
     PHYSICAL CASH LIVE CALCULATION
  ------------------------------------------------------- */

  function updateCashPreview(){

    let total = 0;


    CASH_DENOMINATIONS.forEach(
      denomination => {

        const input =
          document.getElementById(
            "cashNote_" +
            denomination
          );


        const count =
          input
            ? Math.max(
                0,
                Math.floor(
                  num(input.value)
                )
              )
            : 0;


        total +=
          count *
          denomination;


        const line =
          document.getElementById(
            "cashLine_" +
            denomination
          );


        if(line){

          line.textContent =
            "₹ " +
            money(
              count *
              denomination
            );

        }

      }
    );


    const grand =
      document.getElementById(
        "cashGrandTotal"
      );


    if(grand){

      grand.textContent =
        "₹ " +
        money(total);

    }

  }


  /* -------------------------------------------------------
     EDIT MULTIPLE ENTRY
  ------------------------------------------------------- */

  function editQuickEntry(id){

    const collections =
      getCollections();


    const entry =
      collections.find(
        e => e.id === id
      );


    if(!entry) return;


    const newAmount =
      prompt(
        "Enter new amount:",
        entry.amount
      );


    if(newAmount === null)
      return;


    const amount =
      num(newAmount);


    if(amount <= 0){

      alert(
        "Please enter a valid amount."
      );

      return;

    }


    entry.amount =
      amount;


    entry.time =
      new Date().toISOString();


    setCollections(
      collections
    );


    renderQuickArea();

    renderTagsList();

    renderTotals();

  }


  /* -------------------------------------------------------
     RENDER MULTIPLE ENTRY LIST
  ------------------------------------------------------- */

  function renderMultipleList(
    tag
  ){

    const collections =
      getCollections();


    const entries =
      collections.filter(
        e => e.tag === tag
      );


    if(entries.length === 0){

      return `
        <div class="quick-total">
          No entries yet
        </div>
      `;

    let html =
      `<div class="quick-entry-list">`;


    entries
      .slice()
      .reverse()
      .forEach(
        e => {

          html += `

            <div class="quick-entry-item">

                >

                </span>
              </div>

                </span>

                <span
                  onclick="window.quickDeleteEntry('${e.id}')"
                  title="Delete"
                >
                  🗑️
                </span>

              </div>

            </div>

          `;

        }

    html +=

  }


  /* -------------------------------------------------------
     CREATE MULTIPLE CARD
  ------------------------------------------------------- */

  function multipleCard(

    title,
    tag,
    inputId,
    typeText
  ){

    const total =
      getCollections()

        );

  /* -------------------------------------------------------
     FIXED CARD
  ------------------------------------------------------- */

  function fixedCard(
    icon,
    title,
    tag,
    inputId,
    typeText
  ){

    const entries =
      getCollections().filter(
        e => e.tag === tag

  /* -------------------------------------------------------
     PHYSICAL CASH CARD
  ------------------------------------------------------- */

  function physicalCashCard(){

    const notes =
      getCashNotes();


    let noteHTML = "";

              >

              <div

                id="cashLine_${denomination}"
              >
                ₹ ${money(
                  count *
                  denomination
                )}
              </div>

      calculatePhysicalCash();

  /* -------------------------------------------------------

  function renderQuickArea(){

     KEEP QUICK UI SYNCHRONIZED
  ------------------------------------------------------- */

  const oldRenderAll =

  renderQuickArea();

   QUICK COLLECTIONS v2
   ---------------------------------------------------------
   IMPORTANT:
   - Quick entries are now stored separately.
   - They NEVER appear in normal "+ Add Entry" history.
   - Cards / Deposited Cash / Credit Vehicles have history.
   - Physical CASH includes ₹500/₹200/₹100/₹50/₹20/₹10 + COIN.
   - No existing HTML/CSS/JS needs to be edited.
========================================================= */

(function(){

  /* -------------------------------------------------------
     CONFIG
  ------------------------------------------------------- */

  const QKEY = "pumpQuickCollectionsV2";

  const TAGS = {
    card: "Card",
    deposited: "Deposited Cash",
    credit: "Credit Vehicles",
    upi: "UPI Payment",
    physical: "Physical CASH"
  };

  const DENOMINATIONS = [
    500,
    200,
    100,
    50,
    20,
    10
  ];


  /* -------------------------------------------------------
     STORAGE
  ------------------------------------------------------- */

  function loadQuickData(){

    try{

      const raw =
        localStorage.getItem(QKEY);

      if(raw){

        const data =
          JSON.parse(raw);

        return {

          card:
            Array.isArray(data.card)
              ? data.card
              : [],

          deposited:
            Array.isArray(data.deposited)
              ? data.deposited
              : [],

          credit:
            Array.isArray(data.credit)
              ? data.credit
              : [],

          upi:
            num(data.upi),

          physical:
            data.physical || {
              500:0,
              200:0,
              100:0,
              50:0,
              20:0,
              10:0,
              coin:0
            }

        };

      }

    }catch(e){}


    return {

      card:[],
      deposited:[],
      credit:[],
      upi:0,

      physical:{
        500:0,
        200:0,
        100:0,
        50:0,
        20:0,
        10:0,
        coin:0
      }

    };

  }


  function saveQuickData(data){

    localStorage.setItem(
      QKEY,
      JSON.stringify(data)
    );

  }


  let quickData =
    loadQuickData();


  /* -------------------------------------------------------
     FORMAT
  ------------------------------------------------------- */

  function money(v){

    return Number(v || 0).toLocaleString(
      "en-IN",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

  }


  function qId(){

    return (
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,8)
    );

  }


  function qTime(){

    return new Date().toISOString();

  }


  function qTimeText(iso){

    return new Date(iso)
      .toLocaleString(
        "en-IN",
        {
          day:"2-digit",
          month:"short",
          year:"numeric",
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        }
      );

  }


  /* -------------------------------------------------------
     ONE-TIME MIGRATION
     
     Previous version stored quick entries inside
     pumpCollections.

     Move those old quick entries into the new
     private quick storage so they disappear from
     normal Collections.
  ------------------------------------------------------- */

  const migrationKey =
    "pumpQuickCollectionsV2Migrated";


  if(
    !localStorage.getItem(
      migrationKey
    )
  ){

    try{

      const oldCollections =
        getCollections();


      const oldQuickTags = [
        "Card",
        "Deposited Cash",
        "Credit Vehicles",
        "UPI Payment",
        "Physical CASH",
        "COIN"
      ];


      oldCollections
        .filter(
          e =>
            oldQuickTags.includes(
              e.tag
            )
        )
        .forEach(
          e => {

            if(
              e.tag === "Card"
            ){

              quickData.card.push({

                id:qId(),

                amount:num(e.amount),

                time:e.time ||
                  qTime()

              });

            }


            else if(
              e.tag ===
              "Deposited Cash"
            ){

              quickData.deposited.push({

                id:qId(),

                amount:num(e.amount),

                time:e.time ||
                  qTime()

              });

            }


            else if(
              e.tag ===
              "Credit Vehicles"
            ){

              quickData.credit.push({

                id:qId(),

                amount:num(e.amount),

                time:e.time ||
                  qTime()

              });

            }


            else if(
              e.tag ===
              "UPI Payment"
            ){

              quickData.upi =
                num(e.amount);

            }


            else if(
              e.tag ===
              "Physical CASH"
            ){

              /*
                Old Physical Cash was already
                calculated as one amount.

                Keep it as COIN only temporarily
                if denomination information is
                unavailable.

                This prevents losing money during
                migration.
              */

              if(
                num(e.amount) > 0 &&
                !Object.values(
                  quickData.physical
                ).some(
                  v => num(v) > 0
                )
              ){

                quickData.physical.coin =
                  num(e.amount);

              }

            }


            else if(
              e.tag === "COIN"
            ){

              quickData.physical.coin =
                num(e.amount);

            }

          }
        );


      /*
        Remove old quick entries from
        normal Collections.
      */

      const cleaned =
        oldCollections.filter(
          e =>
            !oldQuickTags.includes(
              e.tag
            )
        );


      setCollections(
        cleaned
      );


      saveQuickData(
        quickData
      );


      localStorage.setItem(
        migrationKey,
        "1"

    .qv2-cash{
      grid-column:1 / -1;
    }


    .qv2-note-grid{
      display:grid;
      grid-template-columns:
        repeat(6,1fr);
      gap:5px;
    }


    .qv2-note{
      background:#fafafa;
      border:1px solid #e1e1e1;
      border-radius:7px;
      padding:6px 3px;
      text-align:center;
    }


    .qv2-note-value{
      font-size:.76em;
      font-weight:bold;
      margin-bottom:4px;
    }


    .qv2-note input{
      width:100%;
      box-sizing:border-box;
      text-align:center;
      padding:6px 2px;
      margin:0 !important;
      border:1px solid #d5d5d5;
      border-radius:5px;
      font-size:.78em;
    }


    .qv2-note-total{
      color:#888;
      font-size:.58em;
      margin-top:3px;
    }


    .qv2-coin-row{
      margin-top:8px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px;
      border:1px solid #e5e5e5;
      border-radius:8px;
      background:#fafafa;
    }


    .qv2-coin-icon{
      font-size:20px;
    }


    .qv2-coin-label{
      font-size:.8em;
      font-weight:bold;
      white-space:nowrap;
    }


    .qv2-coin-input{
      flex:1;
      min-width:0;
      padding:7px;
      border:1px solid #d5d5d5;
      border-radius:6px;
      margin:0 !important;
      box-sizing:border-box;
    }


    .qv2-grand{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:8px;
      padding:9px 10px;
      background:#f6f6f6;
      border-radius:8px;
      font-size:.82em;
    }


    .qv2-grand strong{
      font-size:1.08em;
    }


    .qv2-save-cash{
      width:100%;
      border:0;
      border-radius:7px;
      padding:9px;
      margin-top:8px;
      background:#111827;
      color:#fff;
      font-weight:bold;
      cursor:pointer;
    }


    .qv2-fixed-value{
      margin-top:7px;
      font-size:1.05em;
      font-weight:bold;
    }


    @media(max-width:430px){

      .qv2-note-grid{
        grid-template-columns:
          repeat(3,1fr);
      }

    }


    @media(max-width:380px){

      .qv2-grid{
        gap:6px;
      }

      .qv2-head{
        padding:8px;
      }

      .qv2-body{
        padding:8px;
      }

      .qv2-icon{
        width:30px;
        height:30px;
        font-size:16px;
      }

      .qv2-name{
        font-size:.8em;
      }

      .qv2-add{
        padding:8px;
      }

    }

  `;


  document.head.appendChild(style);


  /* -------------------------------------------------------
     FIND OLD QUICK AREA
  ------------------------------------------------------- */

  const oldQuickArea =
    document.getElementById(
      "quickCollectionArea"
    );


  if(!oldQuickArea) return;


  /* -------------------------------------------------------
     HISTORY STATE
  ------------------------------------------------------- */

  const historyOpen = {
    card:false,
    deposited:false,
    credit:false
  };


  /* -------------------------------------------------------
     TOTALS
  ------------------------------------------------------- */

  function listTotal(list){

    return list.reduce(
      (sum,e) =>
        sum + num(e.amount),
      0
    );

  }


  function physicalTotal(){

    const p =
      quickData.physical;


    return (

      num(p[500]) * 500 +

      num(p[200]) * 200 +

      num(p[100]) * 100 +

      num(p[50]) * 50 +

      num(p[20]) * 20 +

      num(p[10]) * 10 +

      num(p.coin)

    );

  }


  /* -------------------------------------------------------
     HISTORY HTML
  ------------------------------------------------------- */

  function historyHTML(type){

    const list =
      quickData[type] || [];


    if(!list.length){

      return `
        <div class="qv2-no-history">
          No entries yet.
        </div>
      `;

    }


    let html = `

      <div class="qv2-history-title">
        📋 Entry History
      </div>

    `;


    list
      .slice()
      .reverse()
      .forEach(
        e => {

          html += `

            <div
              class="qv2-history-item"
            >

              <div>

                <strong>
                  ₹ ${money(e.amount)}
                </strong>

                <span
                  class="qv2-history-time"
                >
                  ${qTimeText(e.time)}
                </span>

              </div>


              <span
                class="qv2-history-delete"
                onclick="
                  window.qv2DeleteHistory(
                    '${type}',
                    '${e.id}'
                  )
                "
                title="Delete entry"
              >
                🗑️
              </span>

            </div>

          `;

        }
      );


    return html;

  }


  /* -------------------------------------------------------
     MULTIPLE ENTRY CARD
  ------------------------------------------------------- */

  function multipleCard(
    type,
    icon,
    title,
    inputId
  ){

    const list =
      quickData[type];


    const total =
      listTotal(list);


    return `

      <div class="qv2-card">

        <div class="qv2-head">

          <div class="qv2-icon">
            ${icon}
          </div>


          <div>

            <div class="qv2-name">
              ${title}
            </div>

            <span class="qv2-type">
              Multiple entries
            </span>

          </div>


          <button
            class="qv2-history-btn"
            onclick="
              window.qv2ToggleHistory(
                '${type}'
              )
            "
            title="View history"
          >
            📋
          </button>

        </div>


        <div class="qv2-body">

          <div class="qv2-input-row">

            <input
              class="qv2-input"
              type="number"
              step="0.01"
              id="${inputId}"
              placeholder="Amount"
            >


            <button
              class="qv2-add"
              onclick="
                window.qv2Add(
                  '${type}',
                  '${inputId}'
                )
              "
            >
              + Add
            </button>

          </div>


          <div class="qv2-total">

            Total:
            <strong>
              ₹ ${money(total)}
            </strong>

          </div>


          <div
            class="
              qv2-history
              ${
                historyOpen[type]
                  ? "open"
                  : ""
              }
            "
          >

            ${
              historyOpen[type]
                ? historyHTML(type)
                : ""
            }

          </div>

        </div>

      </div>

    `;

  }


  /* -------------------------------------------------------
     PHYSICAL CASH CARD
  ------------------------------------------------------- */

  function physicalCashCard(){

    const p =
      quickData.physical;


    let notes = "";


    DENOMINATIONS.forEach(
      d => {

        const count =
          num(p[d]);


        notes += `

          <div class="qv2-note">

            <div
              class="qv2-note-value"
            >
              ₹${d}
            </div>


            <input
              type="number"
              min="0"
              step="1"
              value="${
                count || ""
              }"
              id="qv2note_${d}"
              placeholder="0"
              oninput="
                window.qv2CashPreview()
              "
            >


            <div
              class="qv2-note-total"
              id="qv2noteTotal_${d}"
            >
              ₹ ${money(
                count * d
              )}
            </div>

          </div>

        `;

      }
    );


    const coin =
      num(p.coin);


    return `

      <div class="qv2-card qv2-cash">

        <div class="qv2-head">

          <div class="qv2-icon">
            💰
          </div>


          <div>

            <div class="qv2-name">
              Physical CASH
            </div>

            <span class="qv2-type">
              Notes + Coin
            </span>

          </div>

        </div>


        <div class="qv2-body">


          <div class="qv2-note-grid">

            ${notes}

          </div>


          <div class="qv2-coin-row">

            <span class="qv2-coin-icon">
              🪙
            </span>

            <span class="qv2-coin-label">
              Coin
            </span>

            <input
              class="qv2-coin-input"
              type="number"
              step="0.01"
              min="0"
              id="qv2Coin"
              value="${
                coin || ""
              }"
              placeholder="Amount"
              oninput="
                window.qv2CashPreview()
              "
            >

          </div>


          <div class="qv2-grand">

            <span>
              Total Physical Cash
            </span>

            <strong
              id="qv2GrandTotal"
            >
              ₹ ${money(
                physicalTotal()
              )}
            </strong>

          </div>


          <button
            class="qv2-save-cash"
            onclick="
              window.qv2SaveCash()
            "
          >
            💰 Save Physical Cash
          </button>


        </div>

      </div>

    `;

  }


  /* -------------------------------------------------------
     UPI CARD
  ------------------------------------------------------- */

  function upiCard(){

    return `

      <div class="qv2-card">

        <div class="qv2-head">

          <div class="qv2-icon">
            📱
          </div>


          <div>

            <div class="qv2-name">
              UPI Payment
            </div>

            <span class="qv2-type">
              One fixed entry
            </span>

          </div>

        </div>


        <div class="qv2-body">

          <div class="qv2-input-row">

            <input
              class="qv2-input"
              type="number"
              step="0.01"
              id="qv2UPI"
              value="${
                quickData.upi || ""
              }"
              placeholder="Amount"
            >


            <button
              class="qv2-add"
              onclick="
                window.qv2SaveUPI()
              "
            >
              Save
            </button>

          </div>
  
</script>
</body>
