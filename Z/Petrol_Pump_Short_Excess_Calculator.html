<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petrol Pump Short / Excess</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:20px}
.container{max-width:500px;margin:auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
h2{text-align:center;margin-top:0}
h3{margin-bottom:6px}
label{display:block;margin-top:10px;font-weight:bold;font-size:.9em}
input[type=number],input[type=text]{width:100%;padding:10px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;margin-top:4px}
.result{margin-top:15px;padding:10px;background:#f7f7f7;border-radius:6px;font-weight:bold}
.result.sub{font-weight:normal;font-size:.85em;color:#555;margin-top:6px;background:none;padding:0}
.short{color:#c00}
.excess{color:#090}
.btn{width:100%;padding:10px;margin-top:12px;border:none;border-radius:6px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
.btn.secondary{background:#555}
.btn.small{width:auto;padding:6px 12px;margin-top:0;font-size:.85em}
.section{margin-top:14px;border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px}
.toggle-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:bold}
.arrow{transition:transform .15s;font-size:.9em}
.arrow.open{transform:rotate(90deg)}
.locked-note{font-size:.8em;color:#777;font-weight:normal}
.tag-input-wrap{position:relative}
.suggestions{position:absolute;left:0;right:0;background:#fff;border:1px solid #ccc;border-top:none;border-radius:0 0 6px 6px;max-height:150px;overflow-y:auto;z-index:10}
.suggestions div{padding:8px 10px;cursor:pointer;font-size:.9em}
.suggestions div:hover{background:#eef2ff}
.tag-row{border:1px solid #e5e5e5;border-radius:6px;margin-top:8px;overflow:hidden}
.tag-header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;cursor:pointer;background:#fafafa}
.tag-body{padding:0 12px}
.entry-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #eee;font-size:.9em}
.entry-row:first-child{border-top:none}
.entry-left{color:#333}
.entry-time{color:#999;font-size:.8em;display:block}
.entry-icons span{cursor:pointer;margin-left:8px;font-size:1em}
.edit-row{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid #eee;flex-wrap:wrap}
